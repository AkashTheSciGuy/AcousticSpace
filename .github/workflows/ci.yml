name: Test backend and frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-ml.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Run in-process final demo acceptance checks
        run: python scripts/final_acceptance.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose configuration
        run: |
          mkdir -p backend/models
          docker compose config -q
      - name: Build backend and frontend images
        run: docker compose build
      - name: Smoke-test running containers and API proxy
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health >/dev/null &&
               curl --fail --silent --max-time 5 http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 3
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          curl --fail --silent "http://127.0.0.1:5173/api/model/status?variant=baseline" |
            python -c "import json,sys; assert json.load(sys.stdin)['available'] is False"
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down

